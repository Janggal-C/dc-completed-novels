# 디시 장르소설 갤러리 완결작 집계 설정
gallery_id: genrenovel          # 장르소설 마이너 갤러리
keyword: 완결                   # 제목 검색어

crawl:
  backfill_months: 6            # 처음 실행 시 거슬러 올라갈 기간
  backfill_minutes_per_run: 60  # 초기 수집을 한 번에 최대 몇 분 할지 (넘으면 다음 실행 때 이어서)
  delay_seconds: [1.5, 3.0]     # 요청 사이 대기 (무작위)
  max_retries: 5

judge:
  # verify  : 모든 제목을 규칙 + AI로 판정 (검증 기간)
  # economy : 규칙으로 애매한 것만 AI, 나머지는 표본만 AI 검수 (절약 모드)
  mode: verify
  economy_sample_rate: 0.07     # 절약 모드에서 규칙 판정분 중 AI로 재검수할 비율
  model: haiku                  # haiku(가장 저렴) / sonnet
  batch_size: 60                # AI 한 번에 보낼 제목 수
  max_titles_per_run: 1500      # 한 번 실행당 AI 판정 상한 (Pro 사용량 보호, 남으면 다음 실행)
  review_model: sonnet          # 불일치 검수용 (더 신중한 모델)
  review_per_run: 150           # 한 번 실행당 AI 검수 상한
  search_model: sonnet          # 줄임말 검색용 (haiku는 못 찾는 경우가 많음)
  search_per_run: 40            # 한 번 실행당 줄임말 검색 상한
  search_batch_size: 5
  google_monthly_limit: 240     # SerpApi 무료 월 250회 중 여유 두고 240회
  google_daily_limit: 30        # 하루 구글 검색 상한 (집중 재검색 포함, 넘는 이름은 다음 날로)
  ai_search_fallback: false     # 구글 한도에 못 든 이름을 AI 웹검색으로 찾을지 (false = 그냥 미확인으로 둠)
  google_min_writers: 2         # 작성자 2명 이상이 언급한 이름만 구글 검색 (순위에 영향 있는 것)
  search_retry_days: 14         # 못 찾은 줄임말은 이 기간 동안 재검색 안 함

report:
  min_writers_for_completion: 2 # '완결 추정 월' = 고유 작성자가 이 수 이상인 첫 달
  top_n: 50
  trend_top_n: 6
