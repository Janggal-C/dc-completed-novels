<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장르소설갤 완결작 집계</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f5fb; --surface-1: #ffffff; --border: #e0e3f3;
  --text-primary: #1c2240; --text-secondary: #5b6388; --text-muted: #7d85ab;
  --accent: #3B4890; --badge: #e7eaf8; --warn-bg: #fdf3dc; --warn: #8a5a00;
  --s1: #3B4890; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-0: #12152b; --surface-1: #1b1f3a; --border: #2c3260;
    --text-primary: #eef0fb; --text-secondary: #c7cdf0; --text-muted: #8f98c9;
    --accent: #7c8ce0; --badge: #272d5c; --warn-bg: #3a2e12; --warn: #f0c060;
    --s1: #7c8ce0; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  background: var(--surface-0); color: var(--text-primary); }
header { padding: 20px 16px 8px; max-width: 920px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--text-secondary); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 5; background: var(--surface-0); border-bottom: 1px solid var(--border); }
nav .in { max-width: 920px; margin: 0 auto; display: flex; overflow-x: auto; padding: 0 8px; }
nav button { flex: none; border: 0; background: none; color: var(--text-secondary); font: inherit;
  padding: 12px 12px; border-bottom: 2px solid transparent; cursor: pointer; }
nav button.on { color: var(--text-primary); border-color: var(--accent); font-weight: 600; }
main { max-width: 920px; margin: 0 auto; padding: 12px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: inherit; }
label.chk { font-size: 13px; color: var(--text-secondary); display: flex; gap: 4px; align-items: center; }
ol.rank { list-style: none; padding: 0; margin: 0; }
ol.rank li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border); }
ol.rank li:first-child { border-top: 0; }
.no { color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
ol.rank li:nth-child(1) .no { color: #F5B301; } ol.rank li:nth-child(2) .no { color: #9AA3B8; } ol.rank li:nth-child(3) .no { color: #C98A5B; }
header h1 { color: var(--accent); }
.t { font-weight: 600; }
.au { color: var(--text-muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.num b { font-size: 16px; }
.num small { display: block; color: var(--text-muted); font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--badge); color: var(--accent); margin-left: 4px; vertical-align: 1px; font-weight: 600; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
details.samples summary { cursor: pointer; color: var(--text-muted); font-size: 12px; }
details.samples a { display: block; font-size: 13px; color: var(--text-secondary); padding: 2px 0; }
a { color: var(--accent); text-decoration: none; }
.muted { color: var(--text-muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; border-top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .k { color: var(--text-secondary); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 6px 0 10px; color: var(--text-secondary); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; min-width: 140px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
.btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-1); color: inherit; cursor: pointer; }
.yearsel { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.pbtns { display: grid; gap: 6px; grid-template-columns: repeat(var(--cols, 6), 1fr); }
.pbtn { font: inherit; font-size: 14px; width: 100%; height: 38px; padding: 0; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.pbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.pbtn:disabled { color: var(--text-muted); opacity: .45; cursor: default; }
ol.rank li { grid-template-columns: 34px 1fr auto 28px; }
.tog { border: 0; background: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0; width: 28px; height: 28px;
  border-radius: 6px; transition: transform .15s; align-self: start; }
.tog:hover { background: var(--surface-0); color: var(--text-primary); }
.tog.open { transform: rotate(90deg); color: var(--accent); }
.mchart { grid-column: 1 / -1; display: none; padding: 6px 0 2px 34px; }
.mchart.open { display: block; }
.mchart svg { width: 100%; height: auto; display: block; }
.inp { font: inherit; font-size: 14px; width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); }
.inp:focus { outline: 2px solid var(--accent); border-color: transparent; }
textarea.inp { min-height: 90px; resize: vertical; }
.ur { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 10px 0; border-top: 1px solid var(--border); }
.ur:first-child { border-top: 0; }
.ur .h { display: flex; justify-content: space-between; gap: 8px; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 14px; padding: 8px 14px; }
.sticky { position: sticky; bottom: 0; background: var(--surface-0); padding: 10px 0; display: flex; gap: 8px; align-items: center; }
.bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.empty { padding: 30px 0; text-align: center; color: var(--text-muted); }
code { font-size: 12px; background: var(--surface-0); padding: 1px 4px; border-radius: 4px; }
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblwrap table{min-width:max-content}
.tblwrap td:first-child,.tblwrap th:first-child{white-space:nowrap;position:sticky;left:0;background:var(--surface-1);z-index:1;padding-right:10px}
.tblwrap td.n,.tblwrap th.n{white-space:nowrap}
.btn.danger{background:#D64545;border-color:#D64545;color:#fff}
.chip{display:inline-block;padding:1px 7px;margin:2px 2px 0 0;border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--text)}
</style>
</head>
<body>
<header>
  <h1>장르소설갤 작품 집계</h1>
  <div class="sub" id="meta">불러오는 중…</div>
</header>
<nav><div class="in" id="tabs"></div></nav>
<main id="view"></main>

<script>
const TABS = [["mentions","언급"],["complete","완결"],["trend","추이"],["dict","줄임말 사전"],["check","검수"],["metrics","지표"]];
const VIEW = document.getElementById("view");
const REPO = "https://github.com/Janggal-C/dc-completed-novels";
let R, tab = location.hash.slice(1) || "mentions", sel = {}, onlyNew = false, MEN = null, menKind = "monthly", compKind = "monthly", trendKind = "mentions";
if (tab === "monthly" || tab === "quarterly") { compKind = tab; tab = "complete"; }   // 예전 주소 호환
// 탭 안의 하위 탭 (월별/분기별, 언급/완결)
const subTabs = (items, cur, attr) => `<div class="pbtns" style="--cols:${items.length};margin-bottom:10px">${items.map(([k, v]) =>
  `<button class="pbtn ${k === cur ? "on" : ""}" data-${attr}="${k}">${v}</button>`).join("")}</div>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const postUrl = no => `https://gall.dcinside.com/mgallery/board/view/?id=${R.gallery}&no=${no}`;
const fmtPeriod = p => p.includes("Q") ? p.replace("-Q", "년 ") + "분기" : p.replace("-", "년 ") + "월";

fetch("data/report.json?" + Date.now()).then(r => r.json()).then(d => {
  R = d;
  document.getElementById("meta").innerHTML =
    `마지막 갱신 ${esc(d.updated)} · 데이터 시작 ${esc(d.data_start || "-")}` +
    (d.backfill_done ? "" : ` · <span class="badge warn">초기 수집 진행 중 (${esc(d.data_start)} → 목표 ${esc((d.backfill_cutoff || "").slice(0, 7))})</span>`) +
    (d.in_progress ? ` · <span class="badge">실행 중 · 중간 결과</span>` : "");
  renderTabs(); render();
}).catch(() => { VIEW.innerHTML = `<div class="empty">아직 데이터가 없습니다. 첫 실행 후 표시됩니다.</div>`; });

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, v]) =>
    `<button class="${k === tab ? "on" : ""}" data-k="${k}">${v}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.k; location.hash = tab; renderTabs(); render(); });
}
function render() { if (!TABS.some(t => t[0] === tab)) tab = "mentions"; ({mentions, complete: () => rankView(compKind), trend, dict, check, metrics})[tab](); }

function rankView(kind) {
  const data = R[kind], periods = Object.keys(data).sort().reverse();
  if (!periods.length) { VIEW.innerHTML = `<div class="empty">집계된 작품이 없습니다.</div>`; return; }
  const p = sel[kind] && data[sel[kind]] ? sel[kind] : periods[0];
  const year = p.slice(0, 4);
  const years = [...new Set(periods.map(x => x.slice(0, 4)))].sort().reverse();
  // 기간 버튼: 월별 1~12, 분기별 1~4분기 (데이터 없는 기간은 비활성)
  const slots = kind === "monthly"
    ? Array.from({length: 12}, (_, i) => ({key: `${year}-${String(i + 1).padStart(2, "0")}`, label: `${i + 1}월`}))
    : Array.from({length: 4}, (_, i) => ({key: `${year}-Q${i + 1}`, label: `${i + 1}분기`}));
  let rows = data[p];
  if (onlyNew) rows = rows.filter(e => e.new);
  const startNote = R.data_start && (p === R.data_start || p === quarterOf(R.data_start))
    ? `<div class="muted" style="margin-top:6px">※ 데이터 시작 시점이라 이전부터 언급되던 작품도 '완결'로 보일 수 있습니다.</div>` : "";
  VIEW.innerHTML = `<div class="card">${subTabs([["monthly","월별"],["quarterly","분기별"]], kind, "ck")}
    <div class="yearsel"><select id="yr">${years.map(y => `<option value="${y}" ${y === year ? "selected" : ""}>${y}년</option>`).join("")}</select></div>
    <div class="pbtns" style="--cols:${kind === "monthly" ? 6 : 4}">${slots.map(sl => `<button class="pbtn ${sl.key === p ? "on" : ""}" data-p="${sl.key}" ${data[sl.key] ? "" : "disabled"}>${sl.label}</button>`).join("")}</div>
    <div class="row" style="margin-top:10px"><label class="chk"><input type="checkbox" id="nw" ${onlyNew ? "checked" : ""}> 이 기간에 완결된 작품만</label></div>
    <div class="muted" style="margin-top:6px">완결작만, 완결일 이후 글만 셉니다 · 순위: 고유 작성자 수 → 글 수 · ▸ 월별 그래프</div>${startNote}</div>
    <div class="card"><ol class="rank">${rows.map((e, i) => `<li>
      <div class="no">${i + 1}</div>
      <div><div class="t">${esc(e.title)}${e.author ? `<span class="au">${esc(e.author)}</span>` : ""}${e.status === "예전 완결" ? `<span class="badge" style="background:var(--surface-0);color:var(--text-secondary)">예전 완결</span>` : ""}</div>
        <details class="samples"><summary>대표 글 ${e.samples.length}개 · ${e.status === "예전 완결" ? `${+(R.data_start || "2026-01").slice(5)}월 이전 완결` : `완결 ${esc((e.completion_date || "").slice(5).replace("-", "/"))}`}${e.before_start && e.status !== "예전 완결" ? " (이전 완결 가능)" : ""}</summary>
        <div class="muted" style="font-size:12px">${esc(e.status_reason || "")}</div>
        ${e.samples.map(s => `<a href="${postUrl(s.no)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("")}</details></div>
      <div class="num"><b>${e.writers}</b>명<small>글 ${e.mentions}개</small></div>
      <button class="tog" data-i="${i}" aria-label="월별 그래프 열기" aria-expanded="false">▸</button>
      <div class="mchart" id="mc${i}"></div></li>`).join("") || `<div class="empty">해당하는 작품이 없습니다.</div>`}</ol></div>`;
  document.getElementById("yr").onchange = ev => {
    const y = ev.target.value, inYear = periods.filter(x => x.startsWith(y));
    sel[kind] = inYear[0]; render();
  };
  VIEW.querySelectorAll(".pbtn[data-p]").forEach(b => b.onclick = () => { sel[kind] = b.dataset.p; render(); });
  document.getElementById("nw").onchange = ev => { onlyNew = ev.target.checked; render(); };
  VIEW.querySelectorAll("[data-ck]").forEach(b => b.onclick = () => { compKind = b.dataset.ck; render(); });
  VIEW.querySelectorAll(".tog").forEach(b => b.onclick = () => {
    const box = document.getElementById("mc" + b.dataset.i), open = !box.classList.contains("open");
    box.classList.toggle("open", open); b.classList.toggle("open", open); b.setAttribute("aria-expanded", open);
    if (open && !box.innerHTML) box.innerHTML = expandBox(rows[+b.dataset.i], kind === "monthly" ? p : null);
  });
}

// 언급 탭: 완결 여부와 상관없이 언급 수 (하루 단위 작성자 수)
function mentions() {
  if (!MEN) {
    VIEW.innerHTML = `<div class="empty">불러오는 중…</div>`;
    fetch("data/mentions.json?" + Date.now()).then(r => r.json()).then(d => { MEN = d; if (tab === "mentions") mentions(); })
      .catch(() => { VIEW.innerHTML = `<div class="empty">언급 데이터가 아직 없습니다.</div>`; });
    return;
  }
  const kind = menKind, key = "men-" + kind;
  const periods = Object.keys(MEN.periods).filter(x => kind === "monthly" ? !x.includes("Q") : x.includes("Q")).sort().reverse();
  const p = sel[key] && MEN.periods[sel[key]] ? sel[key] : periods[0];
  const year = p.slice(0, 4);
  const years = [...new Set(periods.map(x => x.slice(0, 4)))].sort().reverse();
  const slots = kind === "monthly"
    ? Array.from({length: 12}, (_, i) => ({key: `${year}-${String(i + 1).padStart(2, "0")}`, label: `${i + 1}월`}))
    : Array.from({length: 4}, (_, i) => ({key: `${year}-Q${i + 1}`, label: `${i + 1}분기`}));
  const rows = MEN.periods[p] || [];
  VIEW.innerHTML = `<div class="card">${subTabs([["monthly","월별"],["quarterly","분기별"]], kind, "kind")}
    <div class="yearsel"><select id="yr">${years.map(y => `<option value="${y}" ${y === year ? "selected" : ""}>${y}년</option>`).join("")}</select></div>
    <div class="pbtns" style="--cols:${kind === "monthly" ? 6 : 4}">${slots.map(sl => `<button class="pbtn ${sl.key === p ? "on" : ""}" data-p="${sl.key}" ${MEN.periods[sl.key] ? "" : "disabled"}>${sl.label}</button>`).join("")}</div>
    <div class="muted" style="margin-top:8px">완결 여부와 상관없이 전체 글 제목에서 셉니다 · 언급 수 = 하루 단위 작성자 수 (같은 사람이 같은 날 여러 번 써도 1) · ▸ 월별 그래프</div></div>
    <div class="card"><ol class="rank">${rows.map((e, i) => `<li>
      <div class="no">${i + 1}</div>
      <div><div class="t">${esc(e.title)}${e.status === "완결" ? `<span class="badge">완결</span>` : ""}</div></div>
      <div class="num"><b>${e.n.toLocaleString()}</b></div>
      <button class="tog" data-i="${i}" aria-label="월별 그래프 열기" aria-expanded="false">▸</button>
      <div class="mchart" id="mc${i}"></div></li>`).join("") || `<div class="empty">해당하는 작품이 없습니다.</div>`}</ol></div>`;
  VIEW.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { menKind = b.dataset.kind; render(); });
  document.getElementById("yr").onchange = ev => { sel[key] = periods.find(x => x.startsWith(ev.target.value)); render(); };
  VIEW.querySelectorAll(".pbtn[data-p]").forEach(b => b.onclick = () => { sel[key] = b.dataset.p; render(); });
  VIEW.querySelectorAll(".tog").forEach(b => b.onclick = () => {
    const box = document.getElementById("mc" + b.dataset.i), open = !box.classList.contains("open");
    box.classList.toggle("open", open); b.classList.toggle("open", open); b.setAttribute("aria-expanded", open);
    if (open && !box.innerHTML) box.innerHTML = expandBox(rows[+b.dataset.i], kind === "monthly" ? p : null, MEN.months, "");
  });
}

function quarterOf(m) { return m.slice(0, 4) + "-Q" + (Math.floor((+m.slice(5, 7) - 1) / 3) + 1); }

// 작품 하나의 월별 언급 작성자 수 막대그래프 (선택한 달은 진하게)
// 작품 → 사전에 있는 줄임말 (정식 제목 자체는 뺌)
let ALI = null;
function aliasesOf(title) {
  if (!ALI) {
    ALI = {};
    for (const d of R.dictionary || []) (ALI[d.title] = ALI[d.title] || []).push(d.alias);
  }
  const key = t => t.replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  return (ALI[title] || []).filter(a => key(a) !== key(title));
}
function expandBox(e, current, months, unit) {
  const al = aliasesOf(e.title);
  return monthBars(e, current, months, unit) +
    `<div class="muted" style="margin-top:6px">줄임말: ${al.length ? al.map(a => `<span class="chip">${esc(a)}</span>`).join(" ") : "없음 (정식 제목으로만 셈)"}</div>`;
}

function monthBars(e, current, months, unit = "명") {
  const M = months || R.months, v = e.series || [];
  if (!M.length) return "";
  const W = Math.max(260, Math.min(820, VIEW.clientWidth - 80)), H = 120, pb = 20, pt = 16;
  const max = Math.max(1, ...v), n = M.length, gap = 2, bw = Math.max(6, (W - gap * (n - 1)) / n);
  const bars = M.map((m, i) => {
    const h = Math.round((H - pt - pb) * (v[i] || 0) / max), x = i * (bw + gap), y = H - pb - h;
    const on = !current || m === current;
    return `<g><title>${fmtPeriod(m)}: ${v[i] || 0}${unit}</title>
      <rect x="${x}" y="${H - pb - Math.max(h, 1)}" width="${bw}" height="${Math.max(h, 1)}" rx="${Math.min(4, bw / 2)}" fill="var(--accent)" opacity="${on ? 1 : 0.35}"/>
      ${v[i] ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${v[i]}</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${+m.slice(5)}월</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(e.title)} 월별 언급 작성자 수">

function lineChart(box, T, M, heading, desc, unit) {
  if (!T.length || M.length < 1) { box.innerHTML = `<div class="card"><div class="t">${heading}</div><div class="empty">추이를 그릴 데이터가 아직 부족합니다.</div></div>`; return; }
  const W = Math.max(300, Math.min(880, VIEW.clientWidth - 30)), H = Math.round(Math.min(320, W * 0.6)), pl = 38, pr = 12, pt = 12, pb = 26;
  const max = Math.max(1, ...T.flatMap(t => t.series));
  const x = i => pl + (M.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (M.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(heading)}">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${v.toLocaleString()}</text>`).join("")}
    ${M.map((m, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${+m.slice(5)}월</text>`).join("")}
    ${T.map((t, k) => `<polyline fill="none" stroke="var(--s${k + 1})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
      points="${t.series.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>
      ${t.series.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--s${k + 1})" stroke="var(--surface-1)" stroke-width="2"/>`).join("")}`).join("")}
    <line class="xh" y1="${pt}" y2="${H - pb}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
    <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent"/></svg>`;
  box.innerHTML = `<div class="card"><div class="t">${heading}</div><div class="muted" style="margin-bottom:6px">${desc} ${T.length}개 작품 · 월별</div>
    <div class="legend">${T.map((t, k) => `<span><i style="background:var(--s${k + 1})"></i>${esc(t.title)}</span>`).join("")}</div>
    <div class="chart">${svg}<div class="tip"></div></div></div>
    <div class="card"><div class="tblwrap"><table><tr><th>작품</th>${M.map(m => `<th class="n">${+m.slice(5)}월</th>`).join("")}</tr>
    ${T.map(t => `<tr><td>${esc(t.title)}</td>${t.series.map(v => `<td class="n">${v.toLocaleString()}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
  const svgEl = box.querySelector("svg"), tip = box.querySelector(".tip"), xh = box.querySelector(".xh");
  const move = ev => {
    const b = svgEl.getBoundingClientRect(), px = (ev.clientX - b.left) * W / b.width;
    const i = Math.max(0, Math.min(M.length - 1, Math.round((px - pl) / ((W - pl - pr) / Math.max(1, M.length - 1)))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.style.display = "";
    tip.innerHTML = `<b>${fmtPeriod(M[i])}</b>` + T.map((t, k) => ({t, k, v: t.series[i]})).sort((a, b) => b.v - a.v)
      .map(o => `<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s${o.k + 1});margin-right:4px"></i>${esc(o.t.title)}</span><b>${o.v.toLocaleString()}${unit}</b></div>`).join("");
    tip.style.display = "block";
    const left = x(i) * b.width / W;
    tip.style.left = Math.min(left + 12, b.width - tip.offsetWidth) + "px"; tip.style.top = "10px";
  };
  svgEl.addEventListener("pointermove", move);
  svgEl.addEventListener("pointerleave", () => { tip.style.display = "none"; xh.style.display = "none"; });
}

const CHECK_HASH = "8d30c678193105253b548f92bd2e972c39f192ae7cc3af3812c0d7b3bcc6e1ec";
let checkOpen = false;
try { checkOpen = sessionStorage.getItem("checkOk") === CHECK_HASH; } catch (e) {}
async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
// 확장 오류 신고 (구글폼 응답 시트, 웹에 게시된 CSV를 바로 읽음)
const REPORT_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyW7rYfg2yrT2Klr9AAejlybfYOTIC7wo6DBeeejuTZ02O_xvKP334uCcG2gOH6_qhZWsUrWedJfii/pub?gid=1104843892&single=true&output=csv";
let REPORTS = null;
function parseCSV(t) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function loadReports() {
  REPORTS = "loading";
  fetch(REPORT_CSV + "&t=" + Date.now()).then(r => r.text()).then(t => {
    const done = new Set(R.reports_done || []);
    REPORTS = parseCSV(t).slice(1).filter(r => r[0] && !done.has(r[0]))
      .map(r => ({ts: r[0], alias: (r[1] || "").trim(), title: (r[2] || "").trim(), url: (r[3] || "").trim(), comment: (r[4] || "").trim()}))
      .reverse();
  }).catch(() => { REPORTS = []; REPORTS.error = true; }).finally(() => { if (tab === "check") check(); });
}

  const rm = a => `<button class="btn" data-rm="${esc(a)}" style="white-space:nowrap;padding:7px 10px">제거</button>`;
  const urow = u => `<div class="ur"><div class="h"><b>${esc(u.alias)}</b><span class="muted">언급 ${u.n}회</span></div>

  const rrow = d => `<div class="ur"><div class="h"><b>${esc(d.alias)}</b><span class="muted">${esc(d.author || "")}</span></div>
    <div>현재: ${esc(d.title)}</div>
    <div class="row" style="flex-wrap:nowrap"><input class="inp" data-alias="${esc(d.alias)}" placeholder="틀렸으면 정식 제목 입력">
    <button class="btn" data-ok="${esc(d.alias)}" data-title="${esc(d.title)}" style="white-space:nowrap;padding:7px 10px">맞음</button>${rm(d.alias)}${g(d.alias)}</div></div>`;
  const prow = r => `<div class="ur"><div class="h"><b>${esc(r.alias || "(직접 신고)")}</b><span class="muted">${esc(r.ts)}</span></div>
    <div style="white-space:pre-line">💬 ${esc(r.comment)}</div>
    ${r.title ? `<div class="muted">현재 연결: ${esc(r.title)}</div>` : ""}
    ${r.url && /^https?:\/\//i.test(r.url) ? `<div class="muted"><a href="${esc(r.url)}" target="_blank" rel="noopener">신고한 글 보기</a></div>` : ""}
    ${r.alias ? `<div class="row" style="flex-wrap:nowrap"><input class="inp" data-alias="${esc(r.alias)}" placeholder="올바른 정식 제목">${rm(r.alias)}${g(r.alias)}</div>` : ""}
    <label class="muted" style="display:block;margin-top:4px"><input type="checkbox" data-done="${esc(r.ts)}"> 처리 완료 (목록에서 지움)</label></div>`;
  const body = checkMode === "reports"
    ? `<div class="card"><div class="t">확장 오류 신고 ${RP.length}개</div>
       <div class="muted">고칠 건 제목 입력·제거로 처리하고, 처리한 신고는 <b>처리 완료</b>를 체크하세요. 직접 신고(여러 줄)는 아래 '직접 입력' 칸에 옮겨 적으면 돼요.</div>

       <div class="card"><div class="t">직접 입력</div><div class="muted">한 줄에 하나씩 <code>줄임말 = 정식 제목</code> 또는 <code>줄임말 = 제거</code></div>

    ? `<div class="card"><div class="t">사전 확인 필요 ${NR.length}개</div>

       ${NR.map(rrow).join("") || `<div class="empty">없습니다 🎉</div>`}</div>`
    : `<div class="card"><div class="t">순위에 영향 있는 것 (언급 2회 이상) ${ranked.length}개</div>${ranked.map(urow).join("") || `<div class="empty">없습니다 🎉</div>`}</div>

       <div class="card"><div class="t">목록에 없는 것 직접 입력</div><div class="muted">한 줄에 하나씩 <code>줄임말 = 정식 제목</code></div>
       <textarea class="inp" id="free" placeholder="후프 = 후회안하는 프로듀서"></textarea></div>`;
  VIEW.innerHTML = `<div class="seg">
      <button class="pbtn ${checkMode === "review" ? "on" : ""}" data-m="review">사전 확인 필요 (${NR.length})</button>

      <button class="pbtn ${checkMode === "reports" ? "on" : ""}" data-m="reports">신고 (${RP.length})</button></div>

    <div class="sticky"><button class="btn primary" id="save">저장</button><span class="muted" id="cnt"></span></div>
    <div class="muted" style="padding-bottom:16px">저장 → 열린 GitHub 화면에서 <b>Create</b> → 1~2분 뒤 반영. 띄어쓰기·플랫폼 군더더기는 자동 정리됩니다.</div>`;
  VIEW.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => { checkMode = b.dataset.m; check(); });

    VIEW.querySelectorAll(`button[data-rm="${CSS.escape(k)}"]`).forEach(b => { b.classList.toggle("danger", rms.has(k)); b.textContent = rms.has(k) ? "✓ 제거" : "제거"; });
  };
  VIEW.querySelectorAll("button[data-ok]").forEach(b => b.onclick = () => {
    const k = b.dataset.ok;

    paint(k); upd();
  });
  VIEW.querySelectorAll("button[data-rm]").forEach(b => b.onclick = () => {
    const k = b.dataset.rm;
    rms.has(k) ? rms.delete(k) : (rms.add(k), oks.delete(k));

  VIEW.addEventListener("input", upd);
  VIEW.addEventListener("change", upd);

    const lines = collect();

  };
}

      ${["완결", "예전 완결", "연재중", "보류"].map(k => tile(k, (R.status_counts || {})[k] ?? 0)).join("")}</div>
      <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">완결 목록에서 뺀 작품 ${(R.excluded || []).length}개 (연재중·보류)</summary>
      <table style="margin-top:6px"><tr><th>작품</th><th>상태</th><th>이유</th></tr>${(R.excluded || []).map(x => `<tr><td>${esc(x.title)}</td><td style="white-space:nowrap">${x.status}</td><td class="muted">${esc(x.reason)}</td></tr>`).join("")}</table></details></div>
    <div class="card"><div class="t">판정</div><div class="tiles" style="margin-top:8px">
      ${tile("수집한 제목", m.total_posts.toLocaleString())}${tile("AI 판정 완료", m.ai_done.toLocaleString())}
      ${tile("판정 대기", m.pending.toLocaleString())}${tile("규칙·AI 일치율", f(m.agreement))}
      ${tile("AI 자동 검수", (m.gold ?? 0) + "건")}${tile("작품 특정 불가 글", m.no_work ?? 0)}</div></div>
    <div class="card"><div class="t">실행 기록</div><table><tr><th>실행</th><th class="n">신규</th><th class="n">AI</th><th class="n">구글</th><th class="n">찾음</th></tr>
    ${R.history.slice().reverse().map(h => `<tr><td>${esc(h.date)}${h.ai_stopped ? ` <span class="badge warn">AI 한도</span>` : ""}</td><td class="n">${h.crawled_new ?? "-"}</td><td class="n">${h.ai_judged ?? "-"}</td><td class="n">${h.google ?? "-"}</td><td class="n">${h.found ?? "-"}</td></tr>`).join("")}</table></div>`;
}
</script>
</body>
</html>
