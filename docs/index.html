<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장르소설갤 완결작 집계</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e0da;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
  --accent: #2a78d6; --badge: #e8f0fb; --warn-bg: #fdf3dc; --warn: #8a5a00;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e88;
    --accent: #3987e5; --badge: #1d2b3d; --warn-bg: #3a2e12; --warn: #f0c060;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  background: var(--surface-0); color: var(--text-primary); }
header { padding: 20px 16px 8px; max-width: 920px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--text-secondary); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 5; background: var(--surface-0); border-bottom: 1px solid var(--border); }
nav .in { max-width: 920px; margin: 0 auto; display: flex; overflow-x: auto; padding: 0 8px; }
nav button { flex: none; border: 0; background: none; color: var(--text-secondary); font: inherit;
  padding: 12px 12px; border-bottom: 2px solid transparent; cursor: pointer; }
nav button.on { color: var(--text-primary); border-color: var(--accent); font-weight: 600; }
main { max-width: 920px; margin: 0 auto; padding: 12px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: inherit; }
label.chk { font-size: 13px; color: var(--text-secondary); display: flex; gap: 4px; align-items: center; }
ol.rank { list-style: none; padding: 0; margin: 0; }
ol.rank li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border); }
ol.rank li:first-child { border-top: 0; }
.no { color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.t { font-weight: 600; }
.au { color: var(--text-muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.num b { font-size: 16px; }
.num small { display: block; color: var(--text-muted); font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--badge); color: var(--accent); margin-left: 4px; vertical-align: 1px; font-weight: 600; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
details.samples summary { cursor: pointer; color: var(--text-muted); font-size: 12px; }
details.samples a { display: block; font-size: 13px; color: var(--text-secondary); padding: 2px 0; }
a { color: var(--accent); text-decoration: none; }
.muted { color: var(--text-muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; border-top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .k { color: var(--text-secondary); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 6px 0 10px; color: var(--text-secondary); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; min-width: 140px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
.btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-1); color: inherit; cursor: pointer; }
.empty { padding: 30px 0; text-align: center; color: var(--text-muted); }
code { font-size: 12px; background: var(--surface-0); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>장르소설갤 완결작 집계</h1>
  <div class="sub" id="meta">불러오는 중…</div>
</header>
<nav><div class="in" id="tabs"></div></nav>
<main id="view"></main>

<script>
const TABS = [["monthly","월별"],["quarterly","분기별"],["trend","추이"],["review","검수"],["dict","줄임말 사전"],["metrics","지표"]];
const VIEW = document.getElementById("view");
const REPO = "https://github.com/answhdtjr736-spec/dc-completed-novels";
let R, tab = location.hash.slice(1) || "monthly", sel = {}, onlyNew = false;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const postUrl = no => `https://gall.dcinside.com/mgallery/board/view/?id=${R.gallery}&no=${no}`;
const fmtPeriod = p => p.includes("Q") ? p.replace("-Q", "년 ") + "분기" : p.replace("-", "년 ") + "월";

fetch("data/report.json?" + Date.now()).then(r => r.json()).then(d => {
  R = d;
  document.getElementById("meta").innerHTML =
    `마지막 갱신 ${esc(d.updated)} · 데이터 시작 ${esc(d.data_start || "-")}` +
    (d.backfill_done ? "" : ` · <span class="badge warn">초기 수집 진행 중</span>`);
  renderTabs(); render();
}).catch(() => { VIEW.innerHTML = `<div class="empty">아직 데이터가 없습니다. 첫 실행 후 표시됩니다.</div>`; });

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, v]) =>
    `<button class="${k === tab ? "on" : ""}" data-k="${k}">${v}${k === "review" && R.metrics.review_open ? ` <span class="badge warn">${R.metrics.review_open}</span>` : ""}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.k; location.hash = tab; renderTabs(); render(); });
}
function render() { ({monthly: () => rankView("monthly"), quarterly: () => rankView("quarterly"), trend, review, dict, metrics})[tab](); }

function rankView(kind) {
  const data = R[kind], periods = Object.keys(data).sort().reverse();
  if (!periods.length) { VIEW.innerHTML = `<div class="empty">집계된 작품이 없습니다.</div>`; return; }
  const p = sel[kind] && data[sel[kind]] ? sel[kind] : periods[0];
  let rows = data[p];
  if (onlyNew) rows = rows.filter(e => e.new);
  const startNote = p.startsWith(R.data_start) || (kind === "monthly" && p === R.data_start)
    ? `<div class="muted" style="margin-top:6px">※ 데이터 시작 시점이라 이전부터 언급되던 작품도 '신규'로 보일 수 있습니다.</div>` : "";
  VIEW.innerHTML = `<div class="card">
    <div class="row"><select id="per">${periods.map(x => `<option value="${x}" ${x === p ? "selected" : ""}>${fmtPeriod(x)}</option>`).join("")}</select>
    <label class="chk"><input type="checkbox" id="nw" ${onlyNew ? "checked" : ""}> 이 기간에 완결된 작품만</label></div>
    <div class="muted" style="margin-top:6px">순위 기준: 언급한 고유 작성자 수 → 언급 글 수</div>${startNote}</div>
    <div class="card"><ol class="rank">${rows.map((e, i) => `<li>
      <div class="no">${i + 1}</div>
      <div><div class="t">${esc(e.title)}${e.author ? `<span class="au">${esc(e.author)}</span>` : ""}${e.new ? `<span class="badge">완결</span>` : ""}${e.needs_review ? `<span class="badge warn">확인 필요</span>` : ""}</div>
        <details class="samples"><summary>대표 글 ${e.samples.length}개 · 완결 추정 ${esc(e.completion_month)}</summary>
        ${e.samples.map(s => `<a href="${postUrl(s.no)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("")}</details></div>
      <div class="num"><b>${e.writers}</b>명<small>글 ${e.mentions}개</small></div></li>`).join("") || `<div class="empty">해당하는 작품이 없습니다.</div>`}</ol></div>`;
  document.getElementById("per").onchange = ev => { sel[kind] = ev.target.value; render(); };
  document.getElementById("nw").onchange = ev => { onlyNew = ev.target.checked; render(); };
}

function trend() {
  const T = R.trend, M = R.months;
  if (!T.length || M.length < 1) { VIEW.innerHTML = `<div class="empty">추이를 그릴 데이터가 아직 부족합니다.</div>`; return; }
  const W = Math.max(300, Math.min(880, VIEW.clientWidth - 30)), H = Math.round(Math.min(320, W * 0.6)), pl = 30, pr = 12, pt = 12, pb = 26;
  const max = Math.max(1, ...T.flatMap(t => t.series));
  const x = i => pl + (M.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (M.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="상위 작품 월별 언급 작성자 수">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${v}</text>`).join("")}
    ${M.map((m, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${+m.slice(5)}월</text>`).join("")}
    ${T.map((t, k) => `<polyline fill="none" stroke="var(--s${k + 1})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
      points="${t.series.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>
      ${t.series.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--s${k + 1})" stroke="var(--surface-1)" stroke-width="2"/>`).join("")}`).join("")}
    <line id="xh" y1="${pt}" y2="${H - pb}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
    <rect id="hit" x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent"/></svg>`;
  VIEW.innerHTML = `<div class="card"><div class="t">상위 ${T.length}개 작품 · 월별 언급 작성자 수</div>
    <div class="legend">${T.map((t, k) => `<span><i style="background:var(--s${k + 1})"></i>${esc(t.title)}</span>`).join("")}</div>
    <div class="chart">${svg}<div class="tip" id="tip"></div></div></div>
    <div class="card"><table><tr><th>작품</th>${M.map(m => `<th class="n">${+m.slice(5)}월</th>`).join("")}</tr>
    ${T.map(t => `<tr><td>${esc(t.title)}</td>${t.series.map(v => `<td class="n">${v}</td>`).join("")}</tr>`).join("")}</table></div>`;
  const svgEl = VIEW.querySelector("svg"), tip = document.getElementById("tip"), xh = document.getElementById("xh");
  const move = ev => {
    const b = svgEl.getBoundingClientRect(), px = (ev.clientX - b.left) * W / b.width;
    const i = Math.max(0, Math.min(M.length - 1, Math.round((px - pl) / ((W - pl - pr) / Math.max(1, M.length - 1)))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.style.display = "";
    tip.innerHTML = `<b>${fmtPeriod(M[i])}</b>` + T.map((t, k) => ({t, k, v: t.series[i]})).sort((a, b) => b.v - a.v)
      .map(o => `<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s${o.k + 1});margin-right:4px"></i>${esc(o.t.title)}</span><b>${o.v}명</b></div>`).join("");
    tip.style.display = "block";
    const left = x(i) * b.width / W;
    tip.style.left = Math.min(left + 12, b.width - tip.offsetWidth) + "px"; tip.style.top = "10px";
  };
  svgEl.addEventListener("pointermove", move);
  svgEl.addEventListener("pointerleave", () => { tip.style.display = "none"; xh.style.display = "none"; });
}

function review() {
  const rv = R.review, lab = {complete: "완결", not: "제외"};
  VIEW.innerHTML = `<div class="card"><div class="t">규칙과 AI 판정이 다른 제목 ${rv.length}건</div>
    <div class="muted">버튼을 누르면 한 줄이 복사됩니다. <a href="${REPO}/edit/main/review/overrides.csv" target="_blank">overrides.csv</a> 맨 아래에 붙여넣고 저장(Commit)하면 다음 실행부터 반영됩니다.
    작품명이 틀렸으면 세 번째 칸에 정식 제목을 적으세요.</div></div>
    <div class="card"><table><tr><th>제목</th><th>규칙</th><th>AI</th><th></th></tr>
    ${rv.map(r => `<tr><td><a href="${postUrl(r.no)}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="muted">${r.date} · #${r.no}</div></td>
      <td>${lab[r.rule] || r.rule}</td><td>${lab[r.ai] || r.ai}</td>
      <td style="white-space:nowrap"><button class="btn" data-l="${r.no},complete,">완결</button> <button class="btn" data-l="${r.no},not,">제외</button></td></tr>`).join("")
      || `<tr><td colspan="4" class="empty">검수할 제목이 없습니다.</td></tr>`}</table></div>`;
  VIEW.querySelectorAll("button[data-l]").forEach(b => b.onclick = () => {
    navigator.clipboard?.writeText(b.dataset.l).then(() => { b.textContent = "복사됨"; });
  });
}

function dict() {
  VIEW.innerHTML = `<div class="card"><div class="t">줄임말 사전 ${R.dictionary.length}개</div>
    <div class="muted">수정은 <a href="${REPO}/edit/main/dict/aliases.json" target="_blank">aliases.json</a>, 작품 정보는 <a href="${REPO}/edit/main/dict/works.json" target="_blank">works.json</a></div>
    <table style="margin-top:8px"><tr><th>줄임말</th><th>정식 제목</th></tr>
    ${R.dictionary.map(d => `<tr><td>${esc(d.alias)}</td><td>${esc(d.title)}${d.author ? `<span class="au">${esc(d.author)}</span>` : ""}${d.needs_review ? `<span class="badge warn">확인 필요</span>` : ""}</td></tr>`).join("")}</table></div>
    <div class="card"><div class="t">사전에 없는 작품명 ${R.unresolved.length}개</div><div class="muted">검색 대기 중이거나 검색으로 못 찾은 이름</div>
    <table style="margin-top:8px"><tr><th>이름</th><th class="n">언급</th><th>예시 제목</th></tr>
    ${R.unresolved.map(u => `<tr><td>${esc(u.alias)}</td><td class="n">${u.n}</td><td class="muted">${u.titles.map(esc).join("<br>")}</td></tr>`).join("")}</table></div>`;
}

function metrics() {
  const m = R.metrics, f = v => v == null ? "-" : v + "%";
  const tiles = [["수집한 제목", m.total_posts.toLocaleString()], ["AI 판정 완료", m.ai_done.toLocaleString()], ["판정 대기", m.pending.toLocaleString()],
    ["규칙·AI 일치율", f(m.agreement)], ["규칙이 판단한 비율", f(m.rule_coverage)], ["검수 대기", m.review_open],
    ["규칙 정확도(검수 기준)", f(m.rule_accuracy)], ["AI 정확도(검수 기준)", f(m.ai_accuracy)]];
  VIEW.innerHTML = `<div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div>
    <div class="card" style="margin-top:12px"><div class="muted">모드: <b>${m.mode === "verify" ? "검증(규칙+AI 전체)" : "절약(규칙 위주)"}</b> · 규칙 버전 ${m.rules_version} · 비교 ${m.compared}건 · 검수 ${m.gold}건<br>
    일치율이 연속 2~3회 95% 이상이면 <code>config.yaml</code>의 <code>mode</code>를 <code>economy</code>로 바꾸는 것을 권장합니다.</div></div>
    <div class="card"><div class="t">실행 기록</div><table><tr><th>실행</th><th class="n">신규</th><th class="n">초기수집</th><th class="n">AI</th><th class="n">일치율</th></tr>
    ${R.history.slice().reverse().map(h => `<tr><td>${esc(h.date)}${h.ai_stopped ? ` <span class="badge warn">AI 한도</span>` : ""}</td><td class="n">${h.crawled_new ?? "-"}</td><td class="n">${h.crawled_backfill ?? "-"}</td><td class="n">${h.ai_judged ?? "-"}</td><td class="n">${f(h.agreement)}</td></tr>`).join("")}</table></div>`;
}
</script>
</body>
</html>
