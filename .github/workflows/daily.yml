name: 매일 수집·집계

on:
  schedule:
    - cron: "43 18 * * *"   # 매일 한국시간 03:43 (UTC 18:43). 몇 분~수십 분 늦게 시작될 수 있음
  push:                      # .github/run-now 파일이 바뀌면 바로 실행 (원격으로 실행 요청할 때 사용)
    paths: [".github/run-now"]
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      step:
        description: "실행 단계 (all=전체, judge=판정·보고서만, report=보고서만)"
        default: all
        type: choice
        options: [all, judge, report]

permissions:
  contents: write
  pages: write       # 보고서 페이지 배포
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url }}
    env:
      WRITER_SALT: ${{ secrets.WRITER_SALT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # 실행을 건 시점이 아니라 '지금' 최신 데이터에서 이어서 시작
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 1) 크롤링
        if: inputs.step == 'all' || inputs.step == ''
        run: python -m src.main crawl

      - name: 크롤링 결과 저장
        if: always() && (inputs.step == 'all' || inputs.step == '')
        run: bash scripts/commit.sh "크롤링 $(TZ=Asia/Seoul date +%F)"

      # 보고서 페이지 배포 (크롤링 직후 1회) — Pages 설정이 'GitHub Actions'일 때만 동작
      - uses: actions/upload-pages-artifact@v4
        if: always() && (inputs.step == 'all' || inputs.step == '')
        continue-on-error: true
        with:
          path: docs
          name: pages-crawl
      - name: 업로드 반영 대기
        if: always() && (inputs.step == 'all' || inputs.step == '')
        run: sleep 15
      - uses: actions/deploy-pages@v4
        if: always() && (inputs.step == 'all' || inputs.step == '')
        continue-on-error: true
        with:
          artifact_name: pages-crawl

      - name: 2) AI 판정 + 줄임말 사전 + 보고서
        if: always() && inputs.step != 'report'
        run: python -m src.main judge

      - name: 보고서만 다시 만들기
        if: inputs.step == 'report'
        run: python -m src.main report

      - name: 판정·보고서 저장
        if: always()
        run: bash scripts/commit.sh "판정·보고서 $(TZ=Asia/Seoul date +%F)"

      # 보고서 페이지 배포 (최종)
      - uses: actions/upload-pages-artifact@v4
        if: always()
        continue-on-error: true
        with:
          path: docs
          name: pages-final
      - name: 업로드 반영 대기
        if: always()
        run: sleep 15
      - id: deploy2
        uses: actions/deploy-pages@v4
        if: always()
        continue-on-error: true
        with:
          artifact_name: pages-final
      - name: 배포 재시도 대기
        if: always() && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - uses: actions/deploy-pages@v4     # GitHub 쪽 일시 오류 대비 1회 재시도
        if: always() && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        with:
          artifact_name: pages-final
