name: 매일 수집·집계

# 사람 개입 없이 매일 새벽 자동 실행 (src/daily.py 참고)
#   수집 → 완결 판정(haiku→sonnet) → 새 단어 → 사전 등록(구글) → AI 검수(sonnet) → 오류 신고 처리 → 소설넷
# 끝나면 '보고서 페이지 배포'가 보고서·확장 사전을 만들어 올린다. 이후 Claude 예약 점검(약 04:40)이 결과를 검사.
on:
  schedule:
    - cron: "7 17 * * *"     # 매일 한국시간 02:07
  push:
    paths: [".github/run-now"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fullcrawl-0         # 6시간마다 도는 제목 수집과 겹치지 않게 같은 줄에 세움
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WRITER_SALT: ${{ secrets.WRITER_SALT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: 매일 실행
        run: python -u -m src.daily
      - name: 저장
        if: always()
        run: bash scripts/commit.sh "매일 실행 $(TZ=Asia/Seoul date '+%F %H:%M')"
