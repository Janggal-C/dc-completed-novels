name: 소설넷 평점·연재처

# 사전 작품을 소설넷에서 찾아 평점·연재처 링크 저장. 이미 찾은 작품은 하루 1/7씩 평점 갱신.
on:
  push:
    paths: [".github/run-ssn"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssn
  cancel-in-progress: false

jobs:
  ssn:
    runs-on: ubuntu-latest
    env:
      COMMIT_PATHS: "dict/ssn.json"
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u -m src.ssn run
      - name: 저장
        if: always()
        run: bash scripts/commit.sh "소설넷 $(TZ=Asia/Seoul date '+%F %H:%M')"
