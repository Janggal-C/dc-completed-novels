name: 노벨피아 TOP100 접근 점검

# robots.txt를 먼저 읽고 허용될 때만 목록 페이지를 한 번 가져와 구조를 확인한다 (src/novelpia_probe.py).
# 결과는 data/novelpia_probe.json 에 저장. 매일 도는 작업이 아니다.
on:
  push:
    paths: [".github/novelpia-probe-run"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novelpia-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u -m src.novelpia_probe
      - name: 저장
        if: always()
        env:
          COMMIT_PATHS: data/novelpia_probe.json
        run: bash scripts/commit.sh "노벨피아 접근 점검 $(TZ=Asia/Seoul date '+%F %H:%M')"
