name: dc-post-cardnews

# 카드뉴스 글쓰기 (수동). 카드 PNG는 cardnews 브랜치의 <month>/ 폴더에서 가져온다.
# test=1: 테스트 갤에 초성 난수 제목 / test=0: 장르소설갤 (자동 게시 확정 전에는 쓰지 않음)
on:
  workflow_dispatch:
    inputs:
      month:
        description: 카드 폴더(YYYY-MM)
        required: true
        default: 2026-09
      test:
        description: 1=테스트 갤
        required: true
        default: "1"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch --depth 1 origin cardnews
          mkdir -p cardnews && git --work-tree=cardnews checkout origin/cardnews -- "${{ inputs.month }}"
          ls -l "cardnews/${{ inputs.month }}"
      - uses: oven-sh/setup-bun@v2
      - run: bun add @green-1052/dcinside.js
      - run: bun scripts/dc-post-cardnews.mjs
        env:
          DC_ID: ${{ secrets.DC_ID }}
          DC_PW: ${{ secrets.DC_PW }}
          CARD_DIR: cardnews/${{ inputs.month }}
          MONTH: ${{ inputs.month }}
          TEST: ${{ inputs.test }}
