name: 전체 제목 수집

# 갤러리 전체 글 제목(본문 X, AI X)을 2026-01-01까지 거슬러 수집.
# 남은 구간을 글번호로 3등분해 동시에 수집. 한 번에 최대 5시간, 6시간마다 자동으로 이어서.
# 모든 구간이 끝나면 0번 작업이 같은 일정으로 새 글만 증분 수집.
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    paths: [".github/run-fullcrawl"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 구간 나누기 (처음 한 번만)
        run: |
          if ! grep -q '"segments"' data/fullcrawl_state.json 2>/dev/null; then
            python -m src.fullcrawl init 3
            bash scripts/commit.sh "전체 제목 수집 구간 나눔"
          fi

  crawl:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        seg: [0, 1, 2]
    concurrency:
      group: fullcrawl-${{ matrix.seg }}
      cancel-in-progress: false
    env:
      COMMIT_PATHS: "data/titles data/fullcrawl data/fullcrawl_state.json"
      WRITER_SALT: ${{ secrets.WRITER_SALT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 구간 ${{ matrix.seg }} 수집
        run: python -m src.fullcrawl seg ${{ matrix.seg }}
      - name: 저장
        if: always()
        run: bash scripts/commit.sh "전체 제목 구간${{ matrix.seg }} $(TZ=Asia/Seoul date '+%F %H:%M')"
