name: 사전 일반 단어 정리 (AI)

on:
  push:
    paths: [".github/run-shortcheck", ".github/run-commonword"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: words
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMMIT_PATHS: "dict data/commonword.json"
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: python -u -m src.commonword run
      - name: 저장
        if: always()
        run: bash scripts/commit.sh "사전 일반 단어 정리 $(TZ=Asia/Seoul date '+%F %H:%M')"
