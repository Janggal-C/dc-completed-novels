name: 대량 검색 (Serper)

# .github/run-bulk 파일이 바뀌면 실행. Serper 무료 2,500회 안에서 상태 확인·미확인 줄임말 처리
on:
  push:
    paths: [".github/run-bulk"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    env:
      COMMIT_PATHS: "dict data/metrics.jsonl"
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: 대량 검색
        run: python -m src.bulk
      - name: 보고서
        if: always()
        run: python -m src.main report && python -m src.mentions
      - name: 저장
        if: always()
        run: bash scripts/commit.sh "대량 검색 $(TZ=Asia/Seoul date +%F)"
      - uses: actions/upload-pages-artifact@v4
        if: always()
        with:
          path: docs
      - run: sleep 15
        if: always()
      - uses: actions/deploy-pages@v4
        if: always()
        continue-on-error: true
