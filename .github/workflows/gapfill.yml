name: 빈 구간 채우기

on:
  push:
    paths: [".github/run-gapfill"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    env:
      COMMIT_PATHS: "data/titles data/fullcrawl data/fullcrawl_state.json"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.fullcrawl fillgaps
      - name: 저장
        if: always()
        run: bash scripts/commit.sh "전체 제목 빈 구간 채우기"
