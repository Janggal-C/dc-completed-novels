name: 디시 접속 테스트

on:
  workflow_dispatch:   # Actions 탭에서 수동 실행
  push:
    paths: [".github/run-probe"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 접속 테스트
        run: python probe.py
