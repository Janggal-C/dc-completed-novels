name: ext-shot

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "지정 글 제목들 ( | 로 구분, 비우면 목록 1쪽 자동)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i playwright && npx playwright install --with-deps chromium && sudo apt-get install -y fonts-noto-cjk >/dev/null
      - run: |
          if [ -n "$TARGETS" ]; then xvfb-run -a node scripts/ext-shot-target.mjs; else xvfb-run -a node scripts/ext-shot.mjs; fi
        env:
          TARGETS: ${{ inputs.targets }}
      - name: 배포된 사이트 캡처 (Claude 세션에서는 github.io가 막혀서 여기서 찍음)
        continue-on-error: true
        run: node scripts/site-shot.mjs
      - name: 캡처를 shots 브랜치에 올림
        run: |
          cd shots && git init -q && git checkout -q -b shots
          git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "확장 캡처 $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots
