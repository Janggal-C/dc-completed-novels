name: 소설넷 구조 확인

# 저장소에 아무것도 저장하지 않는다.
on:
  push:
    paths: [".github/run-ssnprobe"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.ssn_probe
