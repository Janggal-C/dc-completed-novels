name: 보고서 페이지 배포

# 보고서(report.json)·확장 사전(api/dict.json)은 저장소에 두지 않고 여기서 매번 새로 만들어 배포한다.
# - 사전·데이터·페이지 코드를 직접 고쳐 올렸을 때
# - 소설넷 조회가 끝났을 때 (작업이 올린 커밋은 push 이벤트를 만들지 않으므로 workflow_run 으로)
on:
  push:
    paths: ["docs/index.html", "dict/**", "review/**", "data/posts/**", "data/ai/**",
            "src/aggregate.py", "src/export_dict.py", "src/mentions.py", "src/status.py", "src/matcher.py", "config.yaml"]
  workflow_run:
    workflows: ["소설넷 평점·연재처", "단어 분류 (AI)", "작품 단어 사전 등록 (Serper)", "사전 일반 단어 정리 (AI)", "완결 1~5월 AI 판정"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-only
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.aggregate
      - run: python -m src.mentions
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - run: sleep 15
      - id: d
        uses: actions/deploy-pages@v4
