<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>줄임말 사전 설정</title>
<style>
body{font:14px/1.6 "Malgun Gothic",sans-serif;margin:16px;min-width:260px;color:#222}
h1{font-size:16px;margin:0 0 10px} label{display:block;margin:4px 0}
fieldset{border:1px solid #ddd;border-radius:6px;margin:10px 0;padding:6px 10px}
small{color:#777}
</style>
<h1>장르소설갤 줄임말 사전</h1>
<label><input type="checkbox" id="popup"> 마우스 올리면 원제목 팝업</label>
<label>팝업 스킨 <select id="skin"><option value="light">밝게 (흰 바탕)</option><option value="dark">어둡게 (검은 바탕)</option></select></label>
<fieldset><legend>적용 범위</legend>
<label><input type="checkbox" id="list"> 글 목록</label>
<label><input type="checkbox" id="body"> 글 제목·본문</label>
<label><input type="checkbox" id="comment"> 댓글</label>
</fieldset>
<div><small id="info"></small></div>
<div><small>설정은 페이지를 새로고침하면 적용됩니다.</small></div>
<script src="options.js"></script>
</html>
