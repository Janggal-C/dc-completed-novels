<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>줄임말 사전 설정</title>
<link rel="stylesheet" href="content.css">
<style>
body{font:14px/1.6 "Malgun Gothic",sans-serif;margin:16px;min-width:280px;color:#222}
h1{font-size:16px;margin:0 0 10px} label{display:block;margin:4px 0}
fieldset{border:1px solid #ddd;border-radius:6px;margin:10px 0;padding:6px 10px}
small{color:#777}
#order{list-style:none;margin:4px 0;padding:0}
#order li{display:flex;align-items:center;gap:4px;padding:3px 4px;border-bottom:1px solid #f0f0f0}
#order li .n{width:16px;color:#999;font-size:12px}
#order li .name{flex:1}
#order button{border:1px solid #ccc;background:#fff;border-radius:4px;width:24px;height:22px;cursor:pointer;padding:0}
#order button:disabled{opacity:.3;cursor:default}
textarea{width:100%;box-sizing:border-box;font:13px/1.5 "Malgun Gothic",sans-serif;padding:6px;border:1px solid #ccc;border-radius:6px;margin:4px 0}
#rs,#fs{padding:5px 16px;border:0;border-radius:6px;background:#3B4890;color:#fff;cursor:pointer}
#rs:disabled,#fs:disabled{opacity:.5;cursor:default}
.rw{margin:6px 0}
.info small{display:block;white-space:nowrap}
</style>
<div id="reportOnly" hidden>
  <h1>오류 신고</h1>
  <div class="rw">줄임말: <b id="rw"></b></div>
  <textarea id="rc" rows="4" placeholder="예) 이거 괴담동아리임"></textarea>
  <button id="rs">보내기</button> <small id="rm"></small>
</div>
<div id="settings">
<h1>장르소설갤 줄임말 사전</h1>
<label><input type="checkbox" id="popup"> 마우스 올리면 원제목 팝업</label>
<label>팝업 스킨 <select id="skin"><option value="light">밝게 (흰 바탕)</option><option value="dark">어둡게 (검은 바탕)</option></select></label>
<label><input type="checkbox" id="icon"> 연재처 아이콘 표시</label>
<fieldset><legend>연재처 우선순위</legend>
<small>여러 곳에서 연재하면 위에 있는 곳 하나만 표시</small>
<ul id="order"></ul>
</fieldset>
<fieldset><legend>적용 범위</legend>
<label><input type="checkbox" id="list"> 글 목록</label>
<label><input type="checkbox" id="body"> 글 제목·본문</label>
<label><input type="checkbox" id="comment"> 댓글</label>
</fieldset>
<fieldset><legend>오류 신고</legend>
<small>한 줄에 하나씩: 줄임말 + 코멘트</small>
<textarea id="fr" rows="4" placeholder="ex) 괴담동 이거 괴담동아리임&#10;ex) 괴담출 괴담에 떨어져도 출근을 해야 하는구나"></textarea>
<button id="fs">보내기</button> <small id="fm"></small>
</fieldset>
<div id="info" class="info"><small id="info1"></small><small id="info2"></small></div>
<div><small>설정은 페이지를 새로고침하면 적용됩니다.</small></div>
</div>
<script src="platform.js"></script>
<script src="report.js"></script>
<script src="options.js"></script>
</html>
